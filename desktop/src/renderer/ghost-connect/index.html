<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Add Ghost blog</title>
  <link rel="stylesheet" href="../common.css" />
  <link rel="stylesheet" href="ghost-connect.css" />
</head>
<body>
  <main class="gh-connect">
    <header>
      <h1 id="gh-title">Add a Ghost blog</h1>
      <p class="subtitle">Connect any number of Ghost blogs. Each gets its own sync folder.</p>
    </header>

    <section class="form">
      <label class="field">
        <span class="label">Label</span>
        <input id="gh-label" type="text" placeholder="My blog" autocomplete="off" />
      </label>

      <label class="field">
        <span class="label">Ghost URL</span>
        <input id="gh-url" type="url" placeholder="https://blog.example.com" autocomplete="off" />
      </label>

      <label class="field">
        <span class="label">Admin API Key</span>
        <input id="gh-key" type="password" placeholder="xxxxxxxxxxxx:xxxxxxxx…" autocomplete="off" />
      </label>

      <div class="test-row">
        <button id="btn-test" type="button" disabled>Test Connection</button>
        <span id="test-spinner" class="spinner hidden" aria-hidden="true"></span>
        <span id="test-result" class="test-result"></span>
      </div>
    </section>

    <p id="save-error" class="save-error hidden"></p>

    <footer class="actions">
      <button id="btn-cancel" type="button" class="btn-secondary">Cancel</button>
      <button id="btn-connect" type="button" class="btn-primary" disabled>Connect</button>
    </footer>
  </main>

  <script type="module" src="ghost-connect.js"></script>
</body>
</html>
